name: pin-nanoid-once
on:
  push:
    branches:
      - cursor/fix-nanoid-cve-995e
    paths:
      - ".github/workflows/pin-nanoid-once.yml"
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore truncated lockfile and pin nanoid 3.3.18
        run: |
          set -euo pipefail
          git fetch origin main
          if [ ! -f package-lock.json ] || [ "$(wc -c < package-lock.json)" -lt 10000 ]; then
            git checkout origin/main -- package-lock.json
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("package-lock.json")
          text = p.read_text()
          new_tgz = "https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz"
          new_int = "sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w=="
          text = text.replace("https://registry.npmjs.org/nanoid/-/nanoid-3.3.7.tgz", new_tgz)
          text = text.replace("sha512-eSRppjcPIatRIMC1U6UngP8XFcz8MQWGQdt1MTBQ7NaAmvXDfvNxbvWV3x2y6CdEUciCSsDHDQZbhYaB8QEo2g==", new_int)
          text = text.replace("https://registry.npmjs.org/nanoid/-/nanoid-3.3.11.tgz", new_tgz)
          text = text.replace("sha512-N8SpfPUnUp1bK+PMYW8qSWdl9U+wwNWI4QKxOYDy9JAro3WMX7p2OeVRF9v+347pnakNevPmiHhNmZ2HbFA76w==", new_int)
          def repl_block(m):
              block = m.group(0)
              return block.replace('"version": "3.3.7"', '"version": "3.3.18"').replace('"version": "3.3.11"', '"version": "3.3.18"')
          text = re.sub(r'"node_modules/nanoid": \{[^}]+\}', repl_block, text)
          text = re.sub(r'"nanoid": \{[^}]+\}', repl_block, text)
          p.write_text(text)
          PY
          rm -f .github/workflows/pin-nanoid-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "fix: bump lockfile nanoid to 3.3.18 for CVE-2026-67213"
          git push
