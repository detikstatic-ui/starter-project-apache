name: refresh-lockfile

on:
  push:
    branches:
      - cursor/astro7-dependabot-995e

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refresh-lockfile.yml
          git add package-lock.json
          git add -u .github/workflows/refresh-lockfile.yml || true
          if git diff --cached --quiet; then
            echo "No lockfile or workflow changes"
            exit 0
          fi
          git commit -m "chore: refresh package-lock.json for Dependabot patches"
          git push
